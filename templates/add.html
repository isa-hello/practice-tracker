{% extends "base.html" %}

{% block content %}
<h2>Log a Solved Problem</h2>

{% if message %}
<div class="flash">{{ message }}</div>
{% endif %}

<div class="form-card">
<form method="POST" action="{{ url_for('add') }}">
    <div class="field">
        <label>Title</label>
        <input type="text" name="title">
    </div>
    <div class="field">
        <label>Pattern</label>
        <input type="text" name="pattern">
    </div>
    <div class="field">
        <label>Difficulty</label>
        <input type="text" name="difficulty">
    </div>
    <div class="field">
        <label>Date solved</label>
        <input type="date" name="date_solved">
    </div>
    <div class="field checkbox-field">
        <label><input type="checkbox" name="needed_help"> Needed help to solve it?</label>
    </div>
    <div class="field checkbox-field">
        <label><input type="checkbox" name="repeat_retests"> Repeat retests (growing interval)?</label>
    </div>
    <div class="field">
        <label>Notes</label>
        <textarea name="notes"></textarea>
    </div>
    <button type="submit">Save</button>
</form>
</div>

{% endblock %}
